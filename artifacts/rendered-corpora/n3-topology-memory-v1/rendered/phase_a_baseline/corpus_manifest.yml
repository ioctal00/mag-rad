corpus_id: n3-topology-memory-v1-phase_a_baseline
corpus_version: n3-topology-memory-experiment-v1
batch_id: batch-n3-topology-memory-v1-phase_a_baseline
collection_contract_version: n3-topology-memory-v1
description: 'Controlled topology-isolation experiment over the fifteen frozen DBA Top-K SQL shapes. A
  fresh N=2 control panel is followed by two N=3 rounds. Phase A recommendations are frozen from N=2 evidence
  before any N=3 action outcome; Phase B recommendations are frozen after all Phase A outcomes and before
  any Phase B action outcome.

  '
query_groups: ../../../../../workloads/corpus/query-groups.yml
runtime_catalog: ../../../../../workloads/corpus/runtime-configs.yml
dataset_profiles:
  topology-isolation-small-n3-v1:
    profile: ../../../../../datasets/profiles/topology-isolation-small-n3.yml
    load_method: copy_pipe
  topology-isolation-large-n3-v1:
    profile: ../../../../../datasets/profiles/topology-isolation-large-n3.yml
    load_method: copy_pipe
  topology-isolation-medium-n3-v1:
    profile: ../../../../../datasets/profiles/topology-isolation-medium-n3.yml
    load_method: copy_pipe
  topology-isolation-xlarge-n3-v1:
    profile: ../../../../../datasets/profiles/topology-isolation-xlarge-n3.yml
    load_method: copy_pipe
execution_budget:
  hard_timeout_seconds: 1800
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_n3_topology_memory
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 202608062
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  fdw_auto_explain_regions:
  - active_regions
  os_sampler: true
  os_sampler_node_groups:
  - active_regions
  result_signature: true
  result_signature_scope: first_repetition_per_condition
  network_profile_probe: true
  remote_edge_context: true
  group_runtime_configs_by_active_scope: true
