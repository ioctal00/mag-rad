x-join-datasets: &join_datasets
  - raw-small-balanced-v1
  - raw-small-balanced-wide-global-dim-v1
  - pilot-balanced-v1
  - pilot-balanced-wide-global-dim-v1
  - raw-large-balanced-v1
  - raw-large-balanced-wide-global-dim-v1
x-base-join-datasets: &base_join_datasets
  - raw-small-balanced-v1
  - pilot-balanced-v1
  - raw-large-balanced-v1
x-positive-common: &positive_common
  execution_strategy: fdw_raw
  execution_scope: gac_single_edge
  target_scope: global_query
  dataset_profile_id: *join_datasets
  runtime_config_id: gac_force_remote_join
  topology_id: eu_us_gac
  intervention_role: positive_case
  intervention_axis: join_strategy
  pressure_axis: repartition_join
  mitigation_action: use_colocated_distribution
  target_metric: global_gac_mitigation_gain_log2
  dataset_role: pressure_isolated
x-control-common: &control_common
  execution_strategy: fdw_raw
  execution_scope: gac_single_edge
  target_scope: global_query
  dataset_profile_id: *join_datasets
  runtime_config_id: gac_force_remote_join
  topology_id: eu_us_gac
  intervention_role: negative_control
  intervention_axis: join_strategy
  pressure_axis: repartition_join
  mitigation_action: null_join_strategy_intervention
  target_metric: global_gac_mitigation_gain_log2
  dataset_role: pressure_negative_control

corpus_id: pressure-raw-v1-repartition
corpus_version: pressure-raw-corpus-v1
batch_id: batch-130-repartition
collection_contract_version: pressure-raw-v1
parameter_defaults:
  as_of_unix: [1782864000]
description: >
  Ninety-nine counterfactual pairs. Seventy-five positive pairs cover four
  SQL result shapes, three selectivity levels, three dataset sizes, expanded
  global-user dimensions and router calibration. Twenty-four negative-control
  pairs cover reference-table joins and tenant-point queries.
query_groups: ../query-groups.yml
runtime_catalog: ../runtime-configs.yml

dataset_profiles:
  raw-small-balanced-v1:
    profile: ../../../datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe
  raw-small-balanced-wide-global-dim-v1:
    profile: ../../../datasets/profiles/raw-small-balanced-wide-global-dim.yml
    load_method: copy_pipe
  pilot-balanced-v1:
    profile: ../../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  pilot-balanced-wide-global-dim-v1:
    profile: ../../../datasets/profiles/pilot-balanced-wide-global-dim.yml
    load_method: copy_pipe
  raw-large-balanced-v1:
    profile: ../../../datasets/profiles/raw-large-balanced.yml
    load_method: copy_pipe
  raw-large-balanced-wide-global-dim-v1:
    profile: ../../../datasets/profiles/raw-large-balanced-wide-global-dim.yml
    load_method: copy_pipe

execution_budget: {hard_timeout_seconds: 1800, timeout_grace_seconds: 30}
execution_policy:
  cache_policy: mixed_cache_first_observed
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260730
  repetitions_default: 3
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  fdw_auto_explain_regions: [eu]
  os_sampler: true
  os_sampler_node_groups: [eu, analytics_clients]
  result_signature: true
  result_signature_scope: first_repetition_per_condition
  network_profile_probe: false

