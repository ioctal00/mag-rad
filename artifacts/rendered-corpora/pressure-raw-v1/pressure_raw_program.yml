execution_topology_policy:
  primary_analysis_unit: query_run_id
  query_level_concurrency: 1
  measured_queries_are_serial: true
  setup_operations_may_run_in_parallel: true
  topology_generalization:
    notation:
      region_count: N
      workers_in_region: W_r
    current_reference_deployment:
      topology_id: eu_us_gac
      region_count: 2
      region_ids:
      - eu
      - us
      worker_count_by_region:
        eu: 2
        us: 2
      runtime_inventory_must_match: true
    first_prepared_holdout:
      topology_id: eu_us_apac_gac
      region_count: 3
      minimum_worker_count_per_region: 2
      status: blocked_until_topology_preflight
    invariants:
    - one_query_run_id_per_global_sql_execution
    - one_remote_edge_child_row_per_active_region
    - one_region_child_row_per_active_region
    - variable_worker_task_child_rows_are_allowed
    - fixed_eu_us_model_columns_are_forbidden
    - topology_snapshot_id_is_required
    - execution_features_use_permutation_invariant_aggregations
    - topology_holdout_never_merges_into_training_without_explicit_policy
  lanes:
    global_gac_serial:
      batches:
      - batch-100-gac
      - batch-110-remote
      - batch-120-skew
      - batch-200-combined-holdout
      - batch-400-sentinels
      target_group: analytics_clients
      execution_rule: 'Execute one query through GAC. The same query_run_id owns GAC,
        remote-edge, regional coordinator and worker/task evidence. Do not replay
        the same condition separately on EU and US.

        '
    gac_single_edge_serial:
      batches:
      - batch-130-repartition
      - batch-140-regional
      target_group: analytics_clients
      selected_edge: eu_to_gac
      execution_rule: 'Execute one GAC query whose FDW relation set references only
        the selected region. The query_run_id owns the GAC plan, one remote edge,
        the regional auto_explain plan and available worker/task evidence. Only templates
        that pass the regional-pushdown equivalence gate may enter this lane.

        '
    topology_holdout_serial:
      batches:
      - batch-300-n3-holdout
      target_group: analytics_clients
      execution_rule: 'Execute one global query per condition only after the declared
        N-region inventory, per-region worker map and edge contract pass preflight.

        '
  forbidden_optimizations:
  - parallel_pair_members
  - parallel_queries_sharing_gac
  - duplicate_symmetric_region_replays
  - replacing_one_global_gac_query_with_two_single_edge_fdw_queries
  - mixing_direct_regional_elapsed_time_with_global_gac_targets
  allowed_parallelism:
  - independent_dataset_loads_on_eu_and_us
  - independent_bootstrap_or_static_preflight_steps
  single_edge_fdw_policy: 'GAC single-edge runs are the primary lane for isolated
    regional pressure only after template-level pushdown equivalence is demonstrated.
    They preserve a globally measured GAC target without duplicating a symmetric second
    region. Multi-edge GAC remains mandatory for fan-in, imbalance and combined cases.
    Direct regional runs are component-calibration evidence only.

    '
  target_definition_policy:
    primary_target_scope: global_query
    mitigation_gain_formula: log2(gac_elapsed_stressed / gac_elapsed_mitigated)
    direct_region_target_scope: component_region
    direct_region_targets_must_not_enter_primary_regressors: true
  gac_single_edge_equivalence_gate:
    decision: GO_WITH_CONSTRAINTS
    report: analysis/reports/gac-single-edge-equivalence-probe-v1/README.md
    approved_template_ids:
    - gac_fdw_single_edge_colocated_user_join_pair
    - gac_fdw_single_edge_repartition_user_join_pair
    - gac_fdw_single_edge_regional_user_value_topk
    direct_region_role: component_calibration_only
    task_timing_behind_fdw: unavailable_in_embedded_task_plan
    mapmerge_task_evidence: structurally_unavailable_in_both_scopes
manual_execution_protocol:
  freeze_before_first_production_batch:
  - pressure_raw_collection_v1.yml
  - source_manifests
  - generated_checksums
  stages:
  - id: production_probe
    action: run_one_small_segment_from_each_isolated_axis
    gate: raw_index_and_new_telemetry_columns_valid
  - id: isolated_batches
    batch_order:
    - batch-100-gac
    - batch-110-remote
    - batch-120-skew
    - batch-130-repartition
    - batch-140-regional
    gate: completeness_correctness_and_pair_audit_pass
  - id: combined_holdout
    batch_order:
    - batch-200-combined-holdout
    gate: isolated_batches_frozen
  - id: topology_holdout
    batch_order:
    - batch-300-n3-holdout
    gate: three_region_preflight_pass
  sentinel_policy:
    source_batch: batch-400-sentinels
    run_at:
    - before_first_isolated_batch
    - after_batch-110-remote
    - after_batch-120-skew
    - after_batch-140-regional
    - after_combined_holdout
    never_run_all_sentinels_as_one_terminal_block: true
