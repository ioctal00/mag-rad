placement_aware_runner_required: true
locally_rendered_without_infrastructure: true
dry_run_only_until_capability_gate: true
database_result_rows_stored: false
query_condition_count: 4
state_condition_count: 16
execution_condition_count: 16
execution_count: 48
state_count: 4
state_order:
- A
- B
- C
- D
execution_policy:
  cache_policy: mixed_cache_confirmatory_first_observed
  order_policy: deterministic_shuffle_within_state
  shuffle_seed: 20260725
  repetitions: 3
  warmup_per_instance: false
  explicit_cache_reset: false
placement_contract:
  regions:
  - eu
  - us
  metadata_source: citus_shards
  shard_lookup_function: get_shard_id_for_distribution_column
  move_function: citus_move_shard_placement
  move_signature:
  - shard_id
  - source_node_name
  - source_node_port
  - target_node_name
  - target_node_port
  - shard_transfer_mode
  shard_transfer_mode: block_writes
  no_concurrent_writes: true
  colocated_shards_move_together: true
  dispersed:
    algorithm: greedy_hot_event_mass_balance
    dominant_hot_event_share_max: 0.65
    tie_breaker: worker_name_then_shard_id
  concentrated:
    algorithm: move_all_hot_bearing_colocation_groups_to_designated_worker
    dominant_hot_event_share_min: 0.8
    designated_worker_policy: lexicographically_first_active_primary_worker
  rollback:
    primary: replay_inverse_moves_from_placement_intervention_manifest
    fallback: clean_reload_same_dataset_profile_and_seed
  invariants:
  - regional_table_row_counts
  - hot_tenant_ids
  - hot_tenant_event_counts
  - hot_event_share
  - logical_data_contract_id
artifact_contract:
  required_query_scopes:
  - main
  - regional_coordinator
  - worker_task
  required_index_tables:
  - query_runs
  - execution_features
  - region_fragments
  - worker_task_fragments
  database_result_rows_stored: false
group_count: 4
