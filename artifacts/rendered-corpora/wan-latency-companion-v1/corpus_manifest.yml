corpus_id: clean-run-eu-us-gac-wan-latency-v1
vocabulary: ../../docs/corpus-vocabulary.md
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
topology_id: eu_us_gac
topology_scope: eu_us_gac
description: >
  Targeted WAN latency companion for clean-run-v1. This is not a replacement
  baseline corpus. It only exercises FDW row-flow and negative-control query
  families under explicit tc/netem latency profiles.
execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_first_observed
  warmup_per_instance: false
  explicit_cache_reset: false
  repetitions_default: 1
  cache_features_in_default_model: false
  order_policy: deterministic_shuffle
  shuffle_seed: 20260627
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  gac_etl_bootstrap_lookback_days: 1
  gac_etl_bootstrap_timeout_seconds: 300

dataset_profiles:
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  pilot-skew-heavy-v1:
    profile: ../../datasets/profiles/pilot-skew-heavy.yml
    load_method: copy_pipe

cells:
  - corpus_cell_id: wan_fdw_raw_wide_positive
    logical_question_id: event_raw_wide_sample
    execution_strategy: fdw_raw
    template_id: gac_fdw_event_raw_wide_sample
    dataset_profile_id: [pilot-balanced-v1, pilot-skew-heavy-v1]
    runtime_config_id: [wan_0ms, wan_100ms]
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: wan_latency
    expected_regime_targets: [remote_fetch_heavy]
    parameters:
      lookback_days: [7]
      min_value: [500]
      limit_k: [250]
      payload_repeat: [64]
      payload_width: [512]

  - corpus_cell_id: wan_mr_raw_wide_positive
    logical_question_id: event_raw_wide_sample
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_event_raw_wide_sample
    dataset_profile_id: [pilot-balanced-v1, pilot-skew-heavy-v1]
    runtime_config_id: [wan_0ms, wan_100ms]
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: wan_latency
    expected_regime_targets: [remote_fetch_heavy]
    parameters:
      lookback_days: [7]
      min_value: [500]
      limit_k: [250]
      payload_repeat: [64]
      payload_width: [512]

  - corpus_cell_id: wan_mr_top_tenants_positive
    logical_question_id: top_tenants
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_top_tenants
    dataset_profile_id: pilot-skew-heavy-v1
    runtime_config_id: [wan_0ms, wan_100ms]
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: wan_latency
    expected_regime_targets: [remote_fetch_heavy, gac_finalization_heavy]
    parameters:
      lookback_days: [7, 30]
      limit_k: [50, 100]

  - corpus_cell_id: wan_mr_tenant_point_negative
    logical_question_id: tenant_point_rollup
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_tenant_point_rollup
    dataset_profile_id: pilot-balanced-v1
    runtime_config_id: [wan_0ms, wan_100ms]
    topology_id: eu_us_gac
    intervention_role: negative_control
    intervention_axis: wan_latency
    expected_regime_targets: [well_reduced_localized]
    parameters:
      eu_tenant_id: [1]
      us_tenant_id: [10001]
      lookback_days: [7]

  - corpus_cell_id: wan_etl_top_tenants_negative
    logical_question_id: top_tenants
    execution_strategy: etl_materialized
    template_id: gac_etl_top_tenants
    dataset_profile_id: pilot-balanced-v1
    runtime_config_id: [wan_0ms, wan_100ms]
    topology_id: eu_us_gac
    intervention_role: negative_control
    intervention_axis: wan_latency
    expected_regime_targets: [well_reduced_localized]
    parameters:
      lookback_days: [7]
      limit_k: [50]
