corpus_id: clean-run-eu-us-gac-validation-holdout-v1
vocabulary: ../../docs/corpus-vocabulary.md
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
topology_id: eu_us_gac
topology_scope: eu_us_gac
description: >
  Validation holdout for the locked flow-ratio + skew-rerun candidate. This is
  a compact external scan, not a new training baseline. It intentionally mixes
  unseen parameter combinations across dataset asymmetry, WAN/fetch, work_mem,
  ETL controls and single-region controls so the locked model can be checked
  without repeating the full clean-run corpus.
execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_first_observed
  warmup_per_instance: false
  explicit_cache_reset: false
  repetitions_default: 1
  cache_features_in_default_model: false
  order_policy: deterministic_shuffle
  shuffle_seed: 20260706
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  gac_etl_bootstrap_lookback_days: 1
  gac_etl_bootstrap_timeout_seconds: 300

dataset_profiles:
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  pilot-region-imbalanced-v1:
    profile: ../../datasets/profiles/pilot-region-imbalanced.yml
    load_method: copy_pipe
  pilot-region-local-skew-asymmetric-medium-v1:
    profile: ../../datasets/profiles/pilot-region-local-skew-asymmetric-medium.yml
    load_method: copy_pipe

cells:
  - corpus_cell_id: holdout_mr_top_tenants_region_skew
    logical_question_id: top_tenants
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_top_tenants
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: dataset_region_asymmetry
    expected_regime_targets: [remote_fetch_heavy, gac_finalization_heavy, skew_imbalance]
    parameters:
      lookback_days: [1, 7, 30]
      limit_k: [25, 50]

  - corpus_cell_id: holdout_mr_multi_dimension_worker_skew
    logical_question_id: multi_dimension_rollup
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_multi_dimension_rollup
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: dataset_region_asymmetry
    expected_regime_targets: [join_movement, gac_finalization_heavy, skew_imbalance]
    parameters:
      lookback_days: [7, 30]
      limit_k: [50]

  - corpus_cell_id: holdout_mr_user_segment_worker_skew
    logical_question_id: user_segment_topk
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_user_segment_join
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: dataset_region_asymmetry
    expected_regime_targets: [gac_finalization_heavy]
    parameters:
      lookback_days: [7, 30]
      limit_k: [25, 50]

  - corpus_cell_id: holdout_mr_global_user_join_worker_skew
    logical_question_id: global_user_topk
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_global_user_join
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
    runtime_config_id: default
    topology_id: eu_us_gac
