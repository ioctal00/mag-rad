      limit_k: [25]

  - corpus_cell_id: holdout_mr_raw_wide_wan
    logical_question_id: event_raw_wide_sample
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_event_raw_wide_sample
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
    runtime_config_id:
