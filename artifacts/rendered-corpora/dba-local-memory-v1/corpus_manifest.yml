corpus_id: dba-local-memory-panel-v1
corpus_version: dba-local-memory-panel-v1
batch_id: batch-dba-local-memory-v1
collection_contract_version: fuzzy-intervention-memory-v1
description: 'Fifteen previously unseen N=2/N=3 Top-K analytical SQL shapes. Each query is observed between
  one and five times. Every observation has one shared initial state and three independently measured
  actions so the local intervention memory can be replayed after every revealed episode.

  '
query_groups: ../../../workloads/corpus/query-groups.yml
runtime_catalog: ../../../workloads/corpus/runtime-configs.yml
dataset_profiles:
  raw-small-balanced-v1:
    profile: ../../../datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe
  raw-large-balanced-v1:
    profile: ../../../datasets/profiles/raw-large-balanced.yml
    load_method: copy_pipe
  n3-medium-balanced-wide-global-dim-v1:
    profile: ../../../datasets/profiles/n3-medium-balanced-wide-global-dim.yml
    load_method: copy_pipe
  n3-large-balanced-wide-global-dim-v1:
    profile: ../../../datasets/profiles/n3-large-balanced-wide-global-dim.yml
    load_method: copy_pipe
execution_budget:
  hard_timeout_seconds: 1800
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_dba_local_memory
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260805
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  fdw_auto_explain_regions:
  - active_regions
  os_sampler: true
  os_sampler_node_groups:
  - active_regions
  result_signature: true
  result_signature_scope: first_repetition_per_condition
  network_profile_probe: true
  remote_edge_context: true
  group_runtime_configs_by_active_scope: true
