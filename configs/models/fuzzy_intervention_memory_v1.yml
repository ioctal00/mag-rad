contract_version: fuzzy-intervention-memory-v1
description: >
  Local action-response memory over pre-action post-execution evidence. FCM is
  used only as a soft neighborhood index. It does not name physical causes and
  it does not assign effects to actions that have no local support.

sources:
  - id: cross-action-pilot-v1
    index_dir: ../master-regimes-infra/generated/runs/corpus-sweeps/_logical-runs/cross-action-pilot-v1/_index
    required: true
  - id: fuzzy-memory-topk-panel-v1
    index_dir: ../master-regimes-infra/generated/runs/corpus-sweeps/_logical-runs/fuzzy-memory-topk-panel-v1/_index
    required: true

repetitions_per_condition: 3
primary_panel: gac_topk

panels:
  remote_transport:
    component_match_ids:
      - pilot_remote_filter
      - pilot_remote_rollup
      - pilot_remote_wide
    actions:
      - increase_fetch_size
      - remove_added_delay
      - remove_bandwidth_limit
  gac_aggregate:
    component_match_ids: [pilot_gac_aggregate]
    actions:
      - increase_gac_work_mem
      - regional_partial_aggregation
      - mitigate_remote_path_bundle
  gac_topk:
    component_match_ids:
      - pilot_gac_topk
      - fuzzy_topk_transport_severe
      - fuzzy_topk_memory_severe
      - fuzzy_topk_balanced
    actions:
      - increase_gac_work_mem
      - regional_topk_candidates
      - mitigate_remote_path_bundle
  repartition_join:
    component_match_ids: [pilot_repartition_join]
    actions:
      - increase_regional_work_mem
      - use_colocated_distribution
      - mitigate_remote_path_bundle

state_representation:
  pca_components: 6
  minimum_active_features: 8
  features:
    elapsed_seconds: {family: execution, transform: log1p}
    result_row_count: {family: execution, transform: log1p}
    result_output_byte_count: {family: execution, transform: log1p}
    shared_blks_hit_sum: {family: execution, transform: log1p}
    shared_blks_read_sum: {family: execution, transform: log1p}
    temp_blks_written_sum: {family: execution, transform: log1p}
    estimated_result_bytes: {family: flow, transform: log1p}
    estimated_remote_output_bytes: {family: flow, transform: log1p}
    estimated_fanin_bytes: {family: flow, transform: log1p}
    coordinator_main_plan_total_time_ms: {family: gac, transform: log1p}
    coordinator_foreign_scan_time_ms_sum: {family: gac, transform: log1p}
    coordinator_non_foreign_time_share_proxy: {family: gac, transform: identity}
    coordinator_fanin_rows: {family: gac, transform: log1p}
