    edge_available_share: {family: edge, transform: identity}

memory:
  fuzzifier: 1.7
  primary_k: 4
  minimum_scenarios_per_context: 3
  seeds: [11, 29, 47, 71, 101]
  minimum_observed_support: 4
  minimum_effective_support: 2.5
  knn_neighbors: 5
  distance_epsilon: 0.000001

gate:
  minimum_primary_scenarios: 24
  minimum_distinct_rankings: 3
  minimum_pairwise_rank_reversals: 2
  minimum_fcm_pairwise_improvement_over_action_median: 0.03
  require_lower_fcm_regret_than_action_median: true
  require_fcm_not_worse_than_knn: true
  require_bootstrap_superiority: true
  bootstrap_samples: 10000
  random_seed: 42
  response_null_scale_floor: 0.01
