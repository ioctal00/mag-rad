[project]
name = "master-regimes-infra"
version = "0.1.0"
description = "Infrastructure rendering and drift checks for the master-regimes Citus/GAC topology"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.11",
  "pyyaml>=6.0",
]

[project.scripts]
master-regimes-infra = "master_regimes_infra.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/master_regimes_infra"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["common-scripts-archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
