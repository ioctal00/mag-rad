system_id: eu-us-apac-gac-vps
provider: vultr
project_tag: master-regimes

ssh:
  authorized_keys:
    laptop: env:MASTER_REGIMES_SSH_PUBLIC_KEY
  private_key_path: env:MASTER_REGIMES_SSH_PRIVATE_KEY_FILE

access:
  admin_ipv4_cidrs: env:MASTER_REGIMES_ADMIN_IPV4_CIDRS
  web_ipv4_cidrs: env:MASTER_REGIMES_WEB_IPV4_CIDRS
  database_client_ipv4_cidrs: env:MASTER_REGIMES_DATABASE_CLIENT_IPV4_CIDRS

secrets:
  vultr_api_key: env:VULTR_API_KEY
  postgres_admin_password: env:MASTER_REGIMES_POSTGRES_ADMIN_PASSWORD
  app_db_password: env:MASTER_REGIMES_APP_DB_PASSWORD
  analytics_db_password: env:MASTER_REGIMES_ANALYTICS_DB_PASSWORD

postgres:
  version: "18"
  citus_package: "postgresql-18-citus-14.0"
  app_db: app
  app_user: app
  passwords_source: env
  shared_preload_libraries:
    - citus
    - pg_stat_statements
  max_connections: 300
  pg_stat_statements_track: all
  citus_enable_repartition_joins: true

# Central compute selector.
#
# To switch provider model, edit only active_profile below or plan IDs in this
# block, then run the N=3 topology plan/apply target.
# Current cheap VPS profile uses Vultr `vhf-1c-2gb`.
# Previous bare-metal experiment profile is recorded as `vbm-6c-32gb`.
compute_profiles:
  vps:
    resource_type: instance
    coordinator_plan: vhf-1c-2gb
    worker_plan: vhf-1c-2gb
    analytics_plan: vhf-1c-2gb
    web_portal_plan: vhf-1c-2gb
  baremetal:
    resource_type: bare_metal
    # Previously used bare-metal plan; keep this value for reproducibility.
    coordinator_plan: vbm-6c-32gb
    worker_plan: vbm-6c-32gb
    analytics_plan: vbm-6c-32gb
    web_portal_plan: vhf-1c-2gb

# Active deployment profile. Supported here: `vps` or `baremetal`.
active_profile: vps

regions:
  eu:
    vultr_region: ams
    worker_count: 2
    tags: ["eu", "citus", "single-vpc"]
  us:
    vultr_region: ams
    worker_count: 2
    tags: ["us", "citus", "single-vpc", "logical-region"]
  apac:
    # APAC is a logical experimental region. It is intentionally colocated in
    # AMS so controlled network profiles, rather than public geography, define
    # edge conditions.
    vultr_region: ams
    worker_count: 2
    tags: ["apac", "citus", "single-vpc", "logical-region"]

global_analytics:
  enabled: true
  anchor_region: eu
  vultr_region: ams
  attach_vpc: true
  postgresql_enabled: true
  app_db: analytics
  app_user: analytics
  public_access_cidrs: env:MASTER_REGIMES_GAC_PUBLIC_ACCESS_CIDRS

web_portal:
  # The N=3 holdout needs only EU/US/APAC Citus and the GAC node.
  # Enable this again only when deploying the interactive viewer/pgweb portal.
  enabled: false
  anchor_region: eu
  plan: vhf-1c-2gb
  server_name: thesis-demo.example.org
  tls:
    enabled: true
    domain: thesis-demo.example.org
    provider: cloudflare_origin
    cloudflare_proxy: true
    origin_cert_local_path: pki/cloudflare/origin.pem
    origin_key_local_path: pki/cloudflare/origin.key
    force_https: true
  db_readonly_user: prof_demo
  db_readonly_password: env:MASTER_REGIMES_DEMO_DB_PASSWORD
  pgweb_query_timeout_seconds: 100
  basic_auth_users: env:MASTER_REGIMES_CLOUDB_WEB_AUTH_USERS
  viewer_auth_users: env:MASTER_REGIMES_VIEWER_AUTH_USERS
  app_source_mode: git
  apps_repo: https://github.com/PTF-Projects/master-regimes-apps.git
  apps_branch: pivot/fcm-results-rework
  master_regimes_branch: pivot/fcm-results-rework
  master_regimes_infra_branch: pivot/fcm-results-rework
  apps_repo_dir: /opt/master-regimes-apps
  apps_cloudb_subdir: apps/cloudb-web
  apps_viewer_subdir: apps/regime-diagnosis-viewer
  # Nginx is the single public auth guard for the viewer and DB tools.
  # The viewer app keeps its own .env auth support for standalone local runs.
  viewer_auth_disabled: true
  cloudb_web_local_source_hint: ../master-regimes-apps/apps/cloudb-web
  viewer_local_source_hint: ../master-regimes-apps/apps/regime-diagnosis-viewer
  viewer_snapshot_local_path: ../master-regimes-apps/apps/regime-diagnosis-viewer/public/diagnosis-data.json

tools:
  citus_datagen:
    enabled: true
    repo: https://github.com/PTF-Projects/citus-datagen.git
    branch: pivot/fcm-results-rework
  psql_benchmarks:
    enabled: true
    repo: https://github.com/PTF-Projects/psql-benchmarks.git
    branch: pivot/fcm-results-rework
  analytics_client:
    enabled: false
    repo: ""
    branch: pivot/fcm-results-rework
