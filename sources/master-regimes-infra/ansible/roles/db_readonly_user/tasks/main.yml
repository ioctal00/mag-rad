---
- name: Configure read-only demo database role
  when: db_readonly_user_enabled | bool
  block:
    - name: Derive target database for read-only role
      ansible.builtin.set_fact:
        db_readonly_target_database: >-
          {{
            analytics_node_postgresql_app_db
            if 'analytics_clients' in group_names
            else postgresql_app_db
          }}

    - name: Validate read-only role inputs
      ansible.builtin.assert:
        that:
          - db_readonly_user_name | length > 0
          - db_readonly_user_password | length > 0
          - db_readonly_target_database | length > 0
        fail_msg: "Read-only DB role requires user, password and database."
      no_log: true

    - name: Ensure read-only login role exists on every PostgreSQL node
      ansible.builtin.command:
        cmd: "sudo -u postgres psql -v ON_ERROR_STOP=1 --dbname {{ db_readonly_target_database | quote }}"
        stdin: |
          DO $do$
          DECLARE
            role_name text := '{{ db_readonly_user_name | replace("'", "''") }}';
            role_password text := '{{ db_readonly_user_password | replace("'", "''") }}';
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = role_name) THEN
              EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', role_name, role_password);
            ELSE
              EXECUTE format('ALTER ROLE %I WITH LOGIN PASSWORD %L', role_name, role_password);
            END IF;

            EXECUTE format('ALTER ROLE %I SET default_transaction_read_only = on', role_name);
            EXECUTE format('ALTER ROLE %I SET statement_timeout = %L', role_name, '{{ db_readonly_user_statement_timeout | replace("'", "''") }}');
            EXECUTE format('ALTER ROLE %I SET idle_in_transaction_session_timeout = %L', role_name, '{{ db_readonly_user_idle_timeout | replace("'", "''") }}');
          END
          $do$;
      changed_when: true
      when: "'workers' not in group_names"
      no_log: true

    - name: Grant read-only access on coordinator and analytics databases
      ansible.builtin.command:
        cmd: "sudo -u postgres psql -v ON_ERROR_STOP=1 --dbname {{ db_readonly_target_database | quote }}"
        stdin: |
          DO $do$
          DECLARE
            role_name text := '{{ db_readonly_user_name | replace("'", "''") }}';
            schema_name text;
          BEGIN
            EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I', current_database(), role_name);

            FOR schema_name IN
              SELECT nspname
              FROM pg_namespace
              WHERE nspname NOT LIKE 'pg_%'
                AND nspname <> 'information_schema'
            LOOP
              EXECUTE format('GRANT USAGE ON SCHEMA %I TO %I', schema_name, role_name);
              EXECUTE format('GRANT SELECT ON ALL TABLES IN SCHEMA %I TO %I', schema_name, role_name);
              EXECUTE format('GRANT SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', schema_name, role_name);
              EXECUTE format('ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT SELECT ON TABLES TO %I', schema_name, role_name);
              EXECUTE format('ALTER DEFAULT PRIVILEGES IN SCHEMA %I GRANT SELECT ON SEQUENCES TO %I', schema_name, role_name);
            END LOOP;
          END
          $do$;
      changed_when: true
      when: "'workers' not in group_names"
      no_log: true
