candidate_id: phase1_m0_flow_ratio_v3_plus_citus_locality_audit
description: >
  Ablation candidate for testing whether Citus locality/repartition audit
  signals should be promoted from post-hoc plan evidence into the fuzzy
  clustering feature space. This is not the default thesis-facing model unless
  the comparison shows better interpretability without excessive
  template/strategy leakage.

inputs:
  matrix: analysis/reports/clean-run-v1-citus-locality-ablation/m0_plus_citus_locality_audit_scaled.csv
  context: analysis/features/clean-run-v1-flow-ratio-v3/phase1_compact/compact_context.csv
  source_ablation_report: analysis/reports/clean-run-v1-citus-locality-ablation/README.md

model_input_contract:
  observation_id: query_run_id
  matrix_role: ablation_model_input
  context_role: posthoc_audit_only
  context_columns_are_features: false
  missing_indicators_enabled: false
  expected_feature_count: 29
  forbidden_feature_columns:
    - execution_time_seconds
    - elapsed_seconds
    - temp_blocks_sum
    - task_count
    - wan_output_rows
    - wan_output_bytes_proxy
    - regional_reduction_input_rows_proxy
    - regional_reduction_input_bytes_proxy
    - global_group_count_proxy
    - dataset_id
    - dataset_profile_id
    - runtime_config_id
    - template_id
    - instance_id
    - corpus_cell_id
    - logical_question_id
    - execution_strategy
    - intervention_axis
    - expected_regime_targets
    - pressure_tags

manual_fuzzy_clustering:
  script: analysis/scripts/agent/17_m0_reduced_fuzzy_clustering.py
  k_values: [4, 5]
  seeds: "0..9"
  fuzzifier: 1.7
  max_iter: 600
  tolerance: 0.0001
  output_dir: analysis/reports/clean-run-v1-m0-flow-ratio-v3-plus-citus-locality-fuzzy
  progress_log: progress.jsonl
  progress_report: progress_report.md

interpretation_rules:
  - Treat this as an ablation, not as a default replacement for M0.
  - Check fuzzy entropy, top-two margin, seed ARI, cluster balance and context NMI.
  - A better silhouette alone is insufficient if the model mainly isolates a
    small repartition/template fingerprint.
  - If accepted, describe it as a Citus-locality-expanded model variant.
