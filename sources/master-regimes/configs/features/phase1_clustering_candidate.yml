candidate_id: phase1_m0_reduced_v1
description: >
  First candidate input for manual fuzzy regime clustering. This candidate uses
  the compact behavioral M0 reduced matrix selected after Phase 1 feature
  quality/readiness analysis.

inputs:
  matrix: analysis/features/clean-run-v1/phase1_compact/compact_m0_reduced_scaled.csv
  context: analysis/features/clean-run-v1/phase1_compact/compact_context.csv
  phase1_allowlist: configs/features/phase1_compact_allowlist.yml

model_input_contract:
  observation_id: query_run_id
  matrix_role: model_input
  context_role: posthoc_audit_only
  context_columns_are_features: false
  missing_indicators_enabled: false
  expected_feature_count: 21
  forbidden_feature_columns:
    - dataset_id
    - dataset_profile_id
    - runtime_config_id
    - template_id
    - instance_id
    - corpus_cell_id
    - logical_question_id
    - execution_strategy
    - intervention_axis
    - expected_regime_targets
    - pressure_tags

manual_fuzzy_clustering:
  script: analysis/scripts/agent/17_m0_reduced_fuzzy_clustering.py
  k_values: [4, 5]
  seeds: "0..9"
  fuzzifier: 1.7
  max_iter: 600
  tolerance: 0.0001
  output_dir: analysis/reports/clean-run-v1-m0-reduced-fuzzy-final
  progress_log: progress.jsonl
  progress_report: progress_report.md

readiness_reference:
  m0_reduced_readiness: analysis/reports/clean-run-v1-m0-reduced-readiness/README.md
  m1_reduced_readiness: analysis/reports/clean-run-v1-m1-reduced-readiness/README.md
  decision: >
    M0 reduced is the first candidate input because it has better score/stability
    behavior and lower post-hoc association with template/logical-question
    context than M1 reduced. M1 reduced remains useful for interpretability and
    ablation, not as the first default clustering input.

interpretation_rules:
  - Do not interpret cluster labels as ground truth regimes.
  - Use memberships, prototypes and feature deviations to name candidate regimes.
  - Use context association only as post-hoc audit, never as model input.
  - Compare k=4 and k=5 before choosing the thesis-facing run.
  - Companion/intervention corpora validate membership shifts; they are not
    direct labels in this model matrix.
