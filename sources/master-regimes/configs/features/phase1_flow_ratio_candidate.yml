candidate_id: phase1_m0_flow_ratio_v3_reduced
description: >
  Ratio-first flow candidate for fuzzy regime clustering. This candidate keeps
  raw execution volumes out of model input and uses DRF/ISF, remote/final
  ratios, topology-normalized task factors, normalized spill pressure and
  estimate-error signals.

inputs:
  matrix: analysis/features/clean-run-v1-flow-ratio-v3/phase1_compact/compact_m0_flow_ratio_v3_reduced_scaled.csv
  context: analysis/features/clean-run-v1-flow-ratio-v3/phase1_compact/compact_context.csv
  phase1_allowlist: configs/features/phase1_compact_allowlist.yml

model_input_contract:
  observation_id: query_run_id
  matrix_role: model_input
  context_role: posthoc_audit_only
  context_columns_are_features: false
  missing_indicators_enabled: false
  expected_feature_count: 21
  forbidden_feature_columns:
    - execution_time_seconds
    - elapsed_seconds
    - temp_blocks_sum
    - task_count
    - wan_output_rows
    - wan_output_bytes_proxy
    - regional_reduction_input_rows_proxy
    - regional_reduction_input_bytes_proxy
    - global_group_count_proxy
    - dataset_id
    - dataset_profile_id
    - runtime_config_id
    - template_id
    - instance_id
    - corpus_cell_id
    - logical_question_id
    - execution_strategy
    - intervention_axis
    - expected_regime_targets
    - pressure_tags

manual_fuzzy_clustering:
  script: analysis/scripts/agent/17_m0_reduced_fuzzy_clustering.py
  k_values: [4, 5]
  seeds: "0..9"
  fuzzifier: 1.7
  max_iter: 600
  tolerance: 0.0001
  output_dir: analysis/reports/clean-run-v1-m0-flow-ratio-v3-reduced-fuzzy
  progress_log: progress.jsonl
  progress_report: progress_report.md

readiness_reference:
  flow_ratio_v3_readiness: analysis/reports/clean-run-v1-m0-flow-ratio-v3-reduced-readiness/README.md
  flow_no_runtime_v2_readiness: analysis/reports/clean-run-v1-m0-flow-no-runtime-v2-reduced-readiness/README.md
  decision: >
    This candidate tests whether the regime attribution remains interpretable
    when raw absolute volumes are replaced by topology/dataset-normalized
    factors and ratios.

interpretation_rules:
  - Do not interpret cluster labels as ground truth regimes.
  - Use memberships, prototypes and feature deviations to name candidate regimes.
  - Use context association only as post-hoc audit, never as model input.
  - Compare k=4 and k=5 before choosing the thesis-facing run.
  - Raw volumes can be used for severity/audit after clustering, not as default
    clustering input.
