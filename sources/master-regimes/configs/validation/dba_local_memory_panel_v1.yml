contract_version: dba-local-memory-panel-v1
corpus_id: dba-local-memory-panel-v1
logical_run_id: dba-local-memory-panel-v1
description: >
  Fifteen previously unseen N=2/N=3 Top-K analytical SQL shapes. Each query is
  observed between one and five times. Every observation has one shared initial
  state and three independently measured actions so the local intervention
  memory can be replayed after every revealed episode.

actions:
  - increase_gac_work_mem
  - regional_topk_candidates
  - mitigate_remote_path_bundle

action_applicability:
  policy: explicit_panel_contract_and_result_equivalence
  query_family: gac_topk
  applicable_actions:
    - increase_gac_work_mem
    - regional_topk_candidates
    - mitigate_remote_path_bundle

datasets:
  raw-small-balanced-v1:
    profile: datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe
    topology_id: eu_us_gac
    region_count: 2
  raw-large-balanced-v1:
    profile: datasets/profiles/raw-large-balanced.yml
    load_method: copy_pipe
    topology_id: eu_us_gac
    region_count: 2
  n3-medium-balanced-wide-global-dim-v1:
    profile: datasets/profiles/n3-medium-balanced-wide-global-dim.yml
    load_method: copy_pipe
    topology_id: eu_us_apac_gac
    region_count: 3
  n3-large-balanced-wide-global-dim-v1:
    profile: datasets/profiles/n3-large-balanced-wide-global-dim.yml
    load_method: copy_pipe
    topology_id: eu_us_apac_gac
    region_count: 3

runtime_profiles:
  transport:
    baseline: dba_topk_transport_stressed
    remote: dba_topk_transport_remote_mitigated
    gac_memory: dba_topk_transport_gac_mitigated
  memory:
    baseline: dba_topk_memory_stressed
    remote: dba_topk_memory_remote_mitigated
    gac_memory: dba_topk_memory_gac_mitigated
  balanced:
    baseline: dba_topk_balanced_stressed
    remote: dba_topk_balanced_remote_mitigated
    gac_memory: dba_topk_balanced_gac_mitigated

execution:
  hard_timeout_seconds: 1800
  timeout_grace_seconds: 30
  shuffle_seed: 20260805
  result_signature_scope: first_repetition_per_condition

collection_validation:
  workers_per_region: 2
  gac_node_count: 1
  provisioned_node_count: 10

memory:
  reference_report: analysis/reports/fuzzy-intervention-memory-v1
  state_contract: configs/models/fuzzy_intervention_memory_v1.yml
  exact_context_fields:
    - topology_id
    - region_count
    - dataset_profile_id
    - profile
  neighbors: 5
  distance_epsilon: 0.000001
  coverage_quantile: 0.99
  minimum_history_for_available: 2

scenarios:
  - {order: 1, query_id: q01_event_value_desc, query_shape: event_value_desc, dataset: raw-small-balanced-v1, profile: transport, repetitions: 1, cutoff_ts: "2026-06-30 00:00:00+00", limit_k: 25}
  - {order: 2, query_id: q02_event_value_asc, query_shape: event_value_asc, dataset: raw-small-balanced-v1, profile: memory, repetitions: 2, cutoff_ts: "2026-06-29 00:00:00+00", limit_k: 100}
  - {order: 3, query_id: q03_event_recent, query_shape: event_recent, dataset: raw-small-balanced-v1, profile: balanced, repetitions: 3, cutoff_ts: "2026-06-24 00:00:00+00", limit_k: 250}
  - {order: 4, query_id: q04_event_oldest, query_shape: event_oldest, dataset: raw-small-balanced-v1, profile: transport, repetitions: 4, cutoff_ts: "2026-06-17 00:00:00+00", limit_k: 500}
  - {order: 5, query_id: q05_event_deviation, query_shape: event_deviation, dataset: raw-large-balanced-v1, profile: memory, repetitions: 5, cutoff_ts: "2026-06-30 00:00:00+00", limit_k: 50}
  - {order: 6, query_id: q06_tenant_sum, query_shape: tenant_sum, dataset: raw-large-balanced-v1, profile: balanced, repetitions: 1, cutoff_ts: "2026-06-29 00:00:00+00", limit_k: 100}
  - {order: 7, query_id: q07_tenant_count, query_shape: tenant_count, dataset: raw-large-balanced-v1, profile: transport, repetitions: 2, cutoff_ts: "2026-06-24 00:00:00+00", limit_k: 250}
  - {order: 8, query_id: q08_tenant_avg, query_shape: tenant_avg, dataset: raw-large-balanced-v1, profile: memory, repetitions: 3, cutoff_ts: "2026-06-17 00:00:00+00", limit_k: 500}
  - {order: 9, query_id: q09_tenant_max, query_shape: tenant_max, dataset: n3-medium-balanced-wide-global-dim-v1, profile: balanced, repetitions: 4, cutoff_ts: "2026-06-30 00:00:00+00", limit_k: 50}
  - {order: 10, query_id: q10_tenant_min, query_shape: tenant_min, dataset: n3-medium-balanced-wide-global-dim-v1, profile: transport, repetitions: 5, cutoff_ts: "2026-06-29 00:00:00+00", limit_k: 100}
  - {order: 11, query_id: q11_tenant_high_count, query_shape: tenant_high_count, dataset: n3-medium-balanced-wide-global-dim-v1, profile: memory, repetitions: 1, cutoff_ts: "2026-06-24 00:00:00+00", limit_k: 250}
  - {order: 12, query_id: q12_tenant_user_sum, query_shape: tenant_user_sum, dataset: n3-medium-balanced-wide-global-dim-v1, profile: balanced, repetitions: 2, cutoff_ts: "2026-06-17 00:00:00+00", limit_k: 500}
  - {order: 13, query_id: q13_tenant_user_count, query_shape: tenant_user_count, dataset: n3-large-balanced-wide-global-dim-v1, profile: transport, repetitions: 3, cutoff_ts: "2026-06-30 00:00:00+00", limit_k: 50}
  - {order: 14, query_id: q14_tenant_day_sum, query_shape: tenant_day_sum, dataset: n3-large-balanced-wide-global-dim-v1, profile: memory, repetitions: 4, cutoff_ts: "2026-06-24 00:00:00+00", limit_k: 100}
  - {order: 15, query_id: q15_tenant_day_count, query_shape: tenant_day_count, dataset: n3-large-balanced-wide-global-dim-v1, profile: balanced, repetitions: 5, cutoff_ts: "2026-06-17 00:00:00+00", limit_k: 250}
