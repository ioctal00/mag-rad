description: >
  Offline konsolidacija sirokog intervencijskog korpusa, razvojnog panela,
  zavrsnog DBA panela, representation ablationa i kontrolisanog N2/N3 panela.

inputs:
  broad_query_runs: generated/pressure-raw-runs/_program/pressure-raw-v1/_index/query_runs.csv
  broad_consolidation: releases/pressure-actionability-v1/corpus/consolidation_manifest.json
