  frozen_full_model: analysis/reports/n3-topology-memory-v1/model_freeze_recomputed.json

policy:
  actions:
    - increase_gac_work_mem
    - regional_topk_candidates
    - mitigate_remote_path_bundle
  frozen_neighbors: 5
  frozen_distance_metric: euclidean
  frozen_coverage_quantile: 0.99
  minimum_history_for_available: 2
  distance_epsilon: 0.000001
  sensitivity_neighbors: [1, 3, 5]
  sensitivity_metrics: [euclidean, cosine, manhattan]
  sensitivity_quantiles: [0.90, 0.95, 0.99, 1.00]

bootstrap:
  cluster_key: query_id
  samples: 10000
  random_seed: 20260808
  confidence_level: 0.95

