analysis_id: skew-placement-taxonomy-probe-v1
protocol_version: 1
source_manifest: workloads/corpus/corpus_manifest.skew-placement-taxonomy-probe-v1.yml
source_render_dir: generated/corpus/skew-placement-taxonomy-probe-v1-source
output_dir: generated/corpus/skew-placement-taxonomy-probe-v1
selection: workloads/corpus/skew_placement_taxonomy_probe_v1_selection.csv

design:
  topology_id: eu_us_gac
  runtime_config_id: default
  repetitions: 1
  state_order: [B, C]
  order_policy: deterministic_shuffle_within_state
  shuffle_seed: 20260730
  cache_policy: mixed_cache_skew_taxonomy_probe
  warmup_per_instance: false
  explicit_cache_reset: false
  database_result_rows_stored: false

states:
  B:
    state_name: hot_shards_dispersed
    dataset_profile_id: raw-small-skew-heavy-v1
    placement_state_id: hot_shards_dispersed
    logical_data_contract_id: raw-small-skew-heavy-v1-seed-73
    placement_action: disperse_hot_shards
  C:
    state_name: hot_shards_concentrated
    dataset_profile_id: raw-small-skew-heavy-v1
    placement_state_id: hot_shards_concentrated
    logical_data_contract_id: raw-small-skew-heavy-v1-seed-73
    placement_action: concentrate_hot_shards

query_conditions:
  - condition_id: broad_all_shards
    corpus_cell_id: broad_all_shards
    logical_question_id: event_full_scan_summary
    physical_strategy_id: all_shards_full_scan
    template_id: gac_fdw_multiregion_event_count_rollup
    parameters: {lookback_days: 30, as_of_unix: 1785374400}
  - condition_id: hot_key_range
    corpus_cell_id: hot_key_range
    logical_question_id: top_tenants
    physical_strategy_id: hot_key_multishard_probe
    template_id: gac_fdw_multiregion_hot_worker_probe
    parameters:
      eu_hot_tenant_min: 1
      eu_hot_tenant_max: 4
      us_hot_tenant_min: 10001
      us_hot_tenant_max: 10004
      cpu_terms: 32
  - condition_id: tenant_point_hot_pruning_control
    corpus_cell_id: tenant_point_hot_pruning_control
    logical_question_id: tenant_point_rollup
    physical_strategy_id: single_shard_hot_router
    template_id: gac_fdw_multiregion_tenant_point_rollup
    parameters: {eu_tenant_id: 1, us_tenant_id: 10001, lookback_days: 30}
  - condition_id: tenant_point_cold_pruning_control
    corpus_cell_id: tenant_point_cold_pruning_control
    logical_question_id: tenant_point_rollup
    physical_strategy_id: single_shard_cold_router
    template_id: gac_fdw_multiregion_tenant_point_rollup
    parameters: {eu_tenant_id: 100, us_tenant_id: 10100, lookback_days: 30}

capability_smoke:
  condition_ids:
    - broad_all_shards
    - hot_key_range
    - tenant_point_hot_pruning_control
    - tenant_point_cold_pruning_control
  repetition_indices: [0]
  require_checkpoint: false

hot_tenant_contract:
  source_profile: datasets/profiles/raw-small-skew-heavy.yml
  eu_hot_tenant_ids: [1, 2, 3, 4]
  us_hot_tenant_ids: [10001, 10002, 10003, 10004]

placement:
  metadata_source: citus_shards
  move_function: citus_move_shard_placement
  shard_transfer_mode: block_writes
  dispersed:
    dominant_hot_event_share_max: 0.65
  concentrated:
    dominant_hot_event_share_min: 0.80
  rollback:
    primary: replay_inverse_moves_from_placement_intervention_manifest
    fallback: clean_reload_same_dataset_profile_and_seed

artifact_contract:
  required_query_scopes: [main, regional_coordinator, worker_task]
  result_signature_required: true
  database_result_rows_stored: false
