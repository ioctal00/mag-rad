dataset_sweep_id: pressure-raw-datasets-v1
collection_contract_version: pressure-raw-v1
generator:
  name: citus-datagen
  version_source: git_commit_at_load_time
snapshot_contract:
  checksum_scope: profile_and_aggregate_audit_artifacts
  row_level_checksum_included: false
  limitation: >-
    Snapshot identitet povezuje profil, generator, sjeme, vremenski oslonac,
    broj redova, raspodjelu i placement audite. Ne predstavlja nezavisni
    checksum sadrzaja svakog reda nakon novog ucitavanja.
  id_inputs:
    - dataset_profile_sha256
    - generator_git_commit
    - seed
    - base_time_unix
    - lookback_days
    - load_method
    - region
  required_runtime_evidence:
    - dataset_profile_sha256
    - generator_git_commit
    - seed
    - base_time_unix
    - lookback_days
    - measured_event_time_min
    - measured_event_time_max
    - table_row_counts
    - regional_distribution
    - hot_key_profile
    - shard_placement_snapshot
    - worker_placement_snapshot
    - snapshot_checksum

profiles:
  raw-small-balanced-v1:
    profile: ../../datasets/profiles/raw-small-balanced.yml
    size_class: small
    skew_level: balanced
    regional_distribution: balanced
    join_size_ratio_class: events_to_users_2_to_1
    intended_batches: [gac, remote, repartition, regional, skew]
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
