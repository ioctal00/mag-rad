model_use_rules:
- Use M0 flow-ratio-v3 reduced features as the primary clustering input.
- Use execution_severity.csv only as post-hoc intensity/severity, not as clustering
  input.
- Use M1/plan-structure features as post-hoc explanation or ablation, not the locked
  primary matrix.
- Use fuzzy memberships as diagnostic degrees of belonging, not hard supervised labels.
- Use context fields only for leakage checks, stratification and interpretation.
- Keep one model row per query_run_id; do not split regional or worker evidence into
  separate clustering rows.
claims_supported:
- The clean-run-v1 corpus can be represented with an interpretable 21-feature flow-ratio-v3
  behavioral matrix.
- Fuzzy c-means with k=4 provides a stable corpus-conditioned operational four-prototype
  description with fuzzy membership evidence; k=3 is a defensible coarser macro view.
- k=5, K-means and Ward are useful ablations but not the primary diagnostic output.
- On the same final matrix, FCM uncertainty converges with lower hard-centroid margins
  for mixed and weakly covered executions.
- Feature/family attribution can explain why a query is closer to one fuzzy regime
  than to its nearest competitor.
- An existing query execution can be passed through a locked inference-style preprocessing
  and membership computation path.
- Regional and worker child evidence exposes paired balanced/skew contrasts that are
  weaker in the GAC-visible feature subset.
claims_not_supported:
- This is not a universal production model for arbitrary Citus deployments.
- This is not a pre-execution latency predictor.
- This is not a neural/tree plan encoder.
- The learned prototypes are not independent of SQL logical-question families.
- This does not prove causal feature importance; attribution is geometric in the scaled
  feature space.
- The locked M0 model does not treat WAN jitter/loss as learned clustering features.
- Severity is not learned by clustering; it is computed separately from raw/corpus-relative
  audit signals.
