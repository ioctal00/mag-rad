[project]
name = "master-regimes"
version = "0.1.0"
description = "Post-execution regime characterization pipeline for geo-distributed Citus SQL workloads"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "jinja2>=3.1",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "pandas>=2.3",
  "psycopg[binary]>=3.2",
  "pyarrow>=19.0",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "seaborn>=0.13",
  "sqlalchemy>=2.0",
]

[project.scripts]
master-regimes = "master_regimes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/master_regimes"]

[dependency-groups]
dev = [
  "ipykernel>=7.3.0",
  "pytest>=8.3",
  "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
