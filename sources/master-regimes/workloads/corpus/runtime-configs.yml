      scope: region_egress_to_analytics
      target_region_ids: [eu, us]
      configured_delay_ms: 0
      configured_jitter_ms: 0
      configured_loss_percent: 0
      configured_bandwidth_mbit: 0
    applies_when: {}
    negative_control_when: {}
    requires:
      - network_emulation
    expected_effect: >
      Control state for a high-volume regional-to-GAC FDW transfer.

  pressure_remote_stressed:
    description: Small FDW batches, added regional egress delay and bandwidth limit.
    enabled: true
    intervention_axis: remote_path
    pg_options: {}
    regional_pg_options: {}
    psql_variables:
      FETCH_COUNT: "100"
    fdw_server_options:
