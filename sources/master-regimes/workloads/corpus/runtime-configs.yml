    network_profile:
      id: pressure_remote_stressed
      enabled: true
      scope: region_egress_to_analytics
      target_region_ids: [eu, us]
      configured_delay_ms: 40
      configured_jitter_ms: 0
      configured_loss_percent: 0
      configured_bandwidth_mbit: 5
    applies_when: {}
    negative_control_when: {}
    requires:
      - network_emulation
    expected_effect: >
      Increase transfer time for raw/high-fan-in FDW shapes while preserving
      SQL semantics and regional execution plans.

  pressure_remote_smoke_v2_stressed:
    description: >
      Bounded remote-path stress for the final smoke gate. It preserves a
      visible fetch/delay/bandwidth contrast without the multi-minute runtime
