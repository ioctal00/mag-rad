    enabled: true
    intervention_axis: remote_path
    pg_options: {}
    regional_pg_options: {}
    psql_variables:
      FETCH_COUNT: "1000"
    fdw_server_options:
      fetch_size: "1000"
    network_profile:
      id: pressure_remote_smoke_v2_stressed
      enabled: true
      scope: region_egress_to_analytics
      target_region_ids: [eu, us]
      configured_delay_ms: 20
      configured_jitter_ms: 0
      configured_loss_percent: 0
      configured_bandwidth_mbit: 20
    applies_when: {}
    negative_control_when: {}
    requires:
      - network_emulation
    expected_effect: >
      Increase regional-to-GAC transfer time under a bounded smoke-test budget
      while preserving SQL semantics, row flow and regional plan shape.

  pressure_gac_memory_intermediate:
    description: Intermediate GAC work_mem for finalization response curves.
    enabled: true
    intervention_axis: gac_finalization
    pg_options:
