catalog_id: runtime-configs-v1
vocabulary: ../../docs/corpus-vocabulary.md
purpose: >
  Canonical runtime intervention catalog for controlled corpus cells. These
  configs are context/audit variables, not default clustering inputs.

runtime_configs:
  default:
    description: Baseline runtime; no targeted DB/FDW intervention.
    enabled: true
    intervention_axis: none
    pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: baseline

  live_work_mem_64kb:
    description: Viewer-only session profile with deliberately constrained work_mem.
    enabled: true
    intervention_axis: work_mem
    pg_options:
      work_mem: 64kB
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: May expose sort/hash/aggregate spill on the selected query target.

  live_work_mem_64mb:
    description: Viewer-only middle work_mem contrast.
    enabled: true
    intervention_axis: work_mem
    pg_options:
      work_mem: 64MB
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: May reduce spill without changing remote row volume.

  live_join_order_explicit:
    description: Keep the explicit SQL join/from order within the current session.
    enabled: true
    intervention_axis: join_order
    pg_options:
      join_collapse_limit: "1"
      from_collapse_limit: "1"
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: Restricts planner join reordering without a persistent database change.

  live_hashagg_off:
    description: Disable hash aggregation in the current session.
    enabled: true
    intervention_axis: planner_operator
    pg_options:
      enable_hashagg: "off"
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: May choose a sort-based aggregate and alter spill behavior.

  live_parallel_off:
    description: Disable Gather parallel workers in the current session.
    enabled: true
    intervention_axis: parallelism
    pg_options:
      max_parallel_workers_per_gather: "0"
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: Provides a serial execution contrast on the selected target.

  live_parallel_four:
    description: Allow up to four Gather workers in the current session.
    enabled: true
    intervention_axis: parallelism
    pg_options:
      max_parallel_workers_per_gather: "4"
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: Allows, but does not force, a wider parallel plan.

  live_jit_off:
    description: Disable PostgreSQL LLVM JIT in the current session.
    enabled: true
    intervention_axis: jit
    pg_options:
      jit: "off"
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: Removes JIT preparation overhead for this execution.

  live_jit_on:
    description: Enable PostgreSQL LLVM JIT in the current session.
    enabled: true
    intervention_axis: jit
    pg_options:
      jit: "on"
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: Enables JIT when the query and cost thresholds select it.

  gac_force_remote_join:
    description: >
      GAC planner control that disables local join implementations so
      postgres_fdw must use an available foreign-join path. Regional Citus
      planning remains unchanged.
    enabled: true
    intervention_axis: join_strategy
    pg_options:
      enable_hashjoin: "off"
      enable_mergejoin: "off"
      enable_nestloop: "off"
    regional_pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    applies_when:
      join_strategy: high
    negative_control_when: {}
    expected_effect: >
      Each region receives one joined remote SQL statement, allowing
      auto_explain to expose the regional collocated or MapMerge Citus plan.

  fetch_small:
    description: Small postgres_fdw fetch batches for remote-row-flow probes.
    enabled: true
    intervention_axis: fetch_size
    fdw_server_options:
      fetch_size: "100"
    psql_variables:
      FETCH_COUNT: "100"
    pg_options: {}
    applies_when:
      fetch_size: high
    negative_control_when:
      fetch_size:
        - low
        - none
    expected_effect: >
      Should affect FDW remote-row-flow or WAN-sensitive queries more than
      reduced/localized negative controls.

  fetch_large:
    description: Large postgres_fdw fetch batches for remote-row-flow probes.
    enabled: true
    intervention_axis: fetch_size
    fdw_server_options:
      fetch_size: "10000"
    psql_variables:
      FETCH_COUNT: "10000"
    pg_options: {}
    applies_when:
      fetch_size: high
    negative_control_when:
      fetch_size:
        - low
        - none
    expected_effect: >
      Should reduce fetch batching overhead for high remote-row-flow queries
      compared with fetch_small.

  work_mem_low:
    description: Low per-query work_mem for sort/hash/aggregate stress.
    enabled: true
    intervention_axis: work_mem
    pg_options:
      work_mem: 4MB
    psql_variables: {}
    fdw_server_options: {}
    applies_when:
      work_mem: high
    negative_control_when:
      work_mem:
        - low
        - none
    expected_effect: >
      Should increase spill/blocking pressure for sort/hash/aggregate-heavy
      plans more than simple localized controls.

  work_mem_high:
    description: High per-query work_mem contrast for sort/hash/aggregate stress.
    enabled: true
    intervention_axis: work_mem
    pg_options:
      work_mem: 256MB
    psql_variables: {}
    fdw_server_options: {}
    applies_when:
      work_mem: high
    negative_control_when:
      work_mem:
        - low
        - none
    expected_effect: >
      Should reduce spill/blocking pressure relative to work_mem_low when the
      query is memory-sensitive.

  wan_delayed:
    description: Compatibility alias for the strong WAN latency intervention.
    enabled: true
    intervention_axis: wan_latency
    pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    network_profile:
      id: wan_100ms
      enabled: true
      scope: analytics_egress_to_region
      target_region_ids: [eu, us]
      configured_delay_ms: 100
      configured_jitter_ms: 0
      configured_loss_percent: 0
    applies_when:
      wan_latency: high
    negative_control_when:
      wan_latency:
        - low
        - none
    requires:
      - network_emulation
    expected_effect: >
      Should increase observed runtime/remote-path pressure for WAN-sensitive
      FDW row-flow templates while leaving ETL/localized controls less affected.

  wan_0ms:
    description: WAN companion control segment; explicitly resets tc/netem.
    enabled: true
    intervention_axis: wan_latency
    pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    network_profile:
      id: wan_0ms
      enabled: true
      scope: analytics_egress_to_region
      target_region_ids: [eu, us]
      configured_delay_ms: 0
      configured_jitter_ms: 0
      configured_loss_percent: 0
    applies_when:
      wan_latency: high
    negative_control_when:
      wan_latency:
        - low
        - none
    requires:
      - network_emulation
    expected_effect: >
      Control segment for the WAN companion corpus. It records/reset network
      state but should not introduce synthetic delay.

  wan_40ms:
    description: Mild WAN latency intervention for optional sensitivity checks.
    enabled: true
    intervention_axis: wan_latency
    pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    network_profile:
      id: wan_40ms
      enabled: true
      scope: analytics_egress_to_region
      target_region_ids: [eu, us]
      configured_delay_ms: 40
      configured_jitter_ms: 0
      configured_loss_percent: 0
    applies_when:
      wan_latency: high
    negative_control_when:
      wan_latency:
        - low
        - none
    requires:
      - network_emulation
    expected_effect: >
      Optional intermediate latency level for response-curve validation.

  wan_100ms:
    description: Strong WAN latency intervention for targeted companion corpus.
    enabled: true
    intervention_axis: wan_latency
    pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    network_profile:
      id: wan_100ms
      enabled: true
      scope: analytics_egress_to_region
      target_region_ids: [eu, us]
      configured_delay_ms: 100
      configured_jitter_ms: 0
      configured_loss_percent: 0
    applies_when:
      wan_latency: high
    negative_control_when:
      wan_latency:
        - low
        - none
    requires:
      - network_emulation
    expected_effect: >
      Strong synthetic WAN delay for FDW row-flow intervention validation.

  pressure_gac_memory_stressed:
    description: Low GAC work_mem for final sort/hash/aggregate pressure.
    enabled: true
    intervention_axis: gac_finalization
    pg_options:
      work_mem: 64kB
    regional_pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: >
      GAC-side blocking operators should spill when a large remote fan-in is
      finalized on the analytics node.

  pressure_gac_memory_mitigated:
    description: High GAC work_mem control for finalization pressure.
    enabled: true
    intervention_axis: gac_finalization
    pg_options:
      work_mem: 256MB
    regional_pg_options: {}
    psql_variables: {}
    fdw_server_options: {}
    applies_when: {}
    negative_control_when: {}
    expected_effect: >
      The same GAC finalization shape should avoid or reduce temp I/O relative
