corpus_id: pressure-worker-skew-smoke-v1-source
description: >
  Source SQL for the placement-aware worker-skew target smoke. The custom
  runner executes the same three repetition slots first with dispersed and
  then with concentrated hot-shard placement.
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml

dataset_profiles:
  pilot-skew-heavy-v1:
    profile: ../../datasets/profiles/pilot-skew-heavy.yml
    load_method: copy_pipe

execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30

execution_policy:
  cache_policy: mixed_cache_worker_skew_target
  order_policy: deterministic_shuffle
  shuffle_seed: 20260730
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  os_sampler: true

cells:
  - corpus_cell_id: pressure_worker_hot_scan
    logical_question_id: top_tenants
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_hot_worker_probe
    dataset_profile_id: pilot-skew-heavy-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: final_check
    intervention_axis: dataset_and_shard_placement
    pressure_axis: worker_data_skew
    pressure_level: combined
    pressure_pair_key: worker_data_skew__hot_worker_probe__pilot_skew
    mitigation_action: disperse_hot_shards
    target_metric: execution_time_seconds
    dataset_role: pressure_smoke
    expected_regime_targets: [skew_imbalance, remote_fetch_heavy]
    parameters:
      eu_hot_tenant_min: [1]
      eu_hot_tenant_max: [10]
      us_hot_tenant_min: [10001]
      us_hot_tenant_max: [10010]
      cpu_terms: [64]
