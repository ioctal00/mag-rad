corpus_id: join-pressure-intensity-probe-v1
description: >
  Bounded probe that separates distributed JOIN strategy from JOIN intensity.
  Collocated and repartition variants are result-equivalent within each level.
  Direct coordinator and GAC/FDW paths are both collected.
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
parameter_defaults:
  as_of_unix: [1782864000]

dataset_profiles:
  raw-small-balanced-v1:
    profile: ../../datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe

execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30

execution_policy:
  cache_policy: mixed_cache_join_pressure_probe
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260730
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  os_sampler: true
  os_sampler_node_groups:
    - db_nodes
  result_signature: true

cells:
  - corpus_cell_id: join_direct_router_colocated
    logical_question_id: user_segment_topk
    execution_strategy: single_region_citus
    template_id: q11_colocated_user_join_pair
    dataset_profile_id: raw-small-balanced-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: join_strategy
    pressure_axis: repartition_join
    pressure_level: mitigated
    pressure_pair_key: join_direct__router
    mitigation_action: use_colocated_distribution
    target_metric: execution_time_seconds
    dataset_role: join_pressure_probe
    parameters:
      lookback_days: [30]
      limit_k: [50]
      tenant_id_filter: [1]
      tenant_modulus: [1]
      user_id_max: [50]

