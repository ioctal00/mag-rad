next_decision_gate:
  name: pre_us_corpus_pilot_ready
  required_before_us:
    - current_runnable_mini_test passes on at least two dataset profiles.
    - query_runs and feature_overview preserve logical_question_id and execution_strategy.
    - At least two paired families have FDW and ETL/materialized strategies.
    - At least one join-movement family has single_region_citus and fdw_raw evidence.
    - Runtime intervention catalog exists, but only default is required for this gate.
