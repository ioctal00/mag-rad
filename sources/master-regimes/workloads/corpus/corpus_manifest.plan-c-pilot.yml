corpus_id: plan-c-eu-us-gac-pilot-v1
vocabulary: ../../docs/corpus-vocabulary.md
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
topology_id: eu_us_gac
topology_scope: eu_us_gac
description: >
  Controlled EU+US+GAC pilot corpus for the first clustering-ready evidence
  pass. This is larger than parser smoke, but still selective: it uses paired
  logical-question families, two dataset profiles, and only targeted runtime
  interventions where the workload metadata says the intervention is relevant.
execution_budget:
  hard_timeout_seconds: 900
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_first_observed
  warmup_per_instance: false
  explicit_cache_reset: false
  repetitions_default: 1
  cache_features_in_default_model: false
  order_policy: deterministic_shuffle
  shuffle_seed: 20260625
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  gac_etl_bootstrap_lookback_days: 1
  gac_etl_bootstrap_timeout_seconds: 600

dataset_profiles:
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  pilot-skew-heavy-v1:
    profile: ../../datasets/profiles/pilot-skew-heavy.yml
    load_method: copy_pipe

