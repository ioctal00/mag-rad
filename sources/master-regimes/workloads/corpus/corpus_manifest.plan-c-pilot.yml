  # The 30-day variant remains a long-budget rerun candidate once the corpus is
  # otherwise parser/feature ready.
  - corpus_cell_id: daily_rollup_fdw_balanced_default
    logical_question_id: daily_tenant_rollup
    execution_strategy: fdw_raw
    template_id: gac_fdw_daily_rollup
    execution_class: long_budget
    dataset_profile_id: pilot-balanced-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: baseline
    expected_regime_targets: [gac_finalization_heavy]
    parameters:
      lookback_days: [1]
      min_value: [0]

