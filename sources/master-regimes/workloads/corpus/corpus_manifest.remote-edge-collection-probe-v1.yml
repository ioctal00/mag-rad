corpus_id: remote-edge-collection-probe-v1
corpus_version: remote-edge-collection-probe-v1
batch_id: remote-edge-collection-probe-v1
collection_contract_version: pressure-raw-v1
description: >
  Bounded edge-localization probe for remote FDW collection. Logical EU and
  US Citus clusters share one physical VPC; bandwidth, delay and combined
  profiles are controlled interventions on individual region-to-GAC edges.
parameter_defaults:
  as_of_unix: [1782864000]
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml

dataset_profiles:
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe

execution_budget:
  hard_timeout_seconds: 600
  timeout_grace_seconds: 30

execution_policy:
  cache_policy: mixed_cache_first_observed
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260731
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  os_sampler: true
  os_sampler_node_groups: [db_nodes, analytics_clients]
  result_signature: true
  network_profile_probe: true
  remote_edge_context: true

cells:
  - corpus_cell_id: edge_baseline_raw_wide_volume
    logical_question_id: event_raw_wide_sample
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_event_raw_wide_sample
    dataset_profile_id: pilot-balanced-v1
    runtime_config_id: pressure_remote_bandwidth_unlimited
    topology_id: eu_us_gac
    intervention_role: calibration
    intervention_axis: remote_path
    pressure_axis: remote_path
    pressure_level: control
    pressure_pair_key: edge_probe__raw_wide_volume
    remote_shape_id: raw_wide
    edge_stress_scope: none
    transfer_volume_level: parameterized
    network_subblock: transfer_volume
    target_metric: edge_severity_vector
    dataset_role: pressure_calibration
    parameters:
      lookback_days: [30]
      min_value: [0]
      limit_k: [500, 10000]
      payload_repeat: [8]
      payload_width: [256]

  - corpus_cell_id: edge_baseline_selective_filter
