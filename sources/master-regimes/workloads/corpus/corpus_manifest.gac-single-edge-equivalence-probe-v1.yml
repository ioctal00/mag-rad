corpus_id: gac-single-edge-equivalence-probe-v1
corpus_version: gac-single-edge-equivalence-probe-v1
batch_id: batch-900-component-calibration
collection_contract_version: pressure-raw-v1
description: >
  Bounded direct-versus-GAC-single-edge probe. It verifies that a shippable
  FDW wrapper preserves the regional Citus join/finalization work while adding
  a globally measurable GAC boundary and elapsed-time target.
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml

dataset_profiles:
  raw-small-balanced-v1:
    profile: ../../datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe

execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30

execution_policy:
  cache_policy: mixed_cache_single_edge_equivalence
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260730
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  os_sampler: true
  os_sampler_node_groups: [db_nodes, analytics_clients]
  result_signature: true
  result_signature_scope: every_execution
  remote_edge_context: true

cells:
  - corpus_cell_id: direct_colocated_join
    logical_question_id: user_segment_topk
    execution_strategy: single_region_citus
    execution_scope: region_direct
    target_scope: component_region
    component_match_id: join_colocated
    template_id: q20_colocated_user_join_pushdown_pair
    dataset_profile_id: raw-small-balanced-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: calibration
    intervention_axis: join_strategy
    pressure_axis: repartition_join
    pressure_level: mitigated
    pressure_pair_key: single_edge_equivalence__join
    physical_strategy_id: colocated_distributed_join
    mitigation_action: use_colocated_distribution
    target_metric: component_execution_time_seconds
    dataset_role: component_calibration
    parameters: &join_parameters
      cutoff_ts: ["2026-06-01 00:00:00+00"]
      lookback_days: [30]
      limit_k: [50]
      tenant_id_filter: [0]
      tenant_modulus: [1]
      user_id_max: [2147483647]

  - corpus_cell_id: direct_repartition_join
    logical_question_id: user_segment_topk
    execution_strategy: single_region_citus
    execution_scope: region_direct
    target_scope: component_region
    component_match_id: join_repartition
    template_id: q21_repartition_user_join_pushdown_pair
    dataset_profile_id: raw-small-balanced-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: calibration
    intervention_axis: join_strategy
    pressure_axis: repartition_join
    pressure_level: stressed
    pressure_pair_key: single_edge_equivalence__join
    physical_strategy_id: repartition_mapmerge_join
    mitigation_action: use_colocated_distribution
    target_metric: component_execution_time_seconds
    dataset_role: component_calibration
    parameters: *join_parameters

  - corpus_cell_id: gac_single_edge_colocated_join
    logical_question_id: user_segment_topk
    execution_strategy: fdw_raw
    execution_scope: gac_single_edge
    target_scope: global_query
