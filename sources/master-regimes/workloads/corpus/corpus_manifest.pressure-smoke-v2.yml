    mitigation_action: increase_regional_work_mem
    target_metric: execution_time_seconds
    dataset_role: pressure_smoke
    expected_regime_targets: [gac_finalization_heavy]
    parameters:
      lookback_days: [30]
      limit_k: [100000]
      amplification_factor: [16]
