  - corpus_cell_id: pressure_v2_regional_finalization_mitigated
    logical_question_id: user_value_topk
    execution_strategy: single_region_citus
    template_id: q13_amplified_user_topk
    dataset_profile_id: pilot-balanced-v1
    runtime_config_id: pressure_regional_memory_mitigated
    topology_id: eu_us_gac
    intervention_role: final_check
    intervention_axis: regional_finalization
    pressure_axis: regional_finalization
    pressure_level: mitigated
    pressure_pair_key: regional_finalization__user_topk_wide__balanced
    mitigation_action: increase_regional_work_mem
