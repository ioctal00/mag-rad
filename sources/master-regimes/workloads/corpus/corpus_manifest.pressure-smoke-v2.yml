  - corpus_cell_id: pressure_v2_join_repartition_stressed
    logical_question_id: user_segment_topk
    execution_strategy: single_region_citus
    template_id: q12_repartition_user_join_pair
    dataset_profile_id: pilot-balanced-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: final_check
    intervention_axis: join_strategy
    pressure_axis: repartition_join
    pressure_level: stressed
    pressure_pair_key: repartition_join__paired_user_join__balanced
    mitigation_action: use_colocated_distribution
    target_metric: execution_time_seconds
    dataset_role: pressure_smoke
    expected_regime_targets: [join_movement]
    parameters:
      lookback_days: [7]
