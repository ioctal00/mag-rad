description: >
  One fixed extended-budget recovery attempt for all 16 incomplete queries
  from the primary STATS-CEB full no-refit audit. The data, SQL, physical
  design, feature contract, family weights, k=4 centers, fuzzifier m=1.7,
  empirical P99 threshold and prototype names remain frozen.
execution_budget:
