    template_id: stats_ceb_multiregion_count
    dataset_profile_id: stats-ceb-full-recovery-1800s-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: final_check
    intervention_axis: execution_budget
    expected_regime_targets:
      - remote_fetch_heavy
      - join_movement
      - well_reduced_localized
