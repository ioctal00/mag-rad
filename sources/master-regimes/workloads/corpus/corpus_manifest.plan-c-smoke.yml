corpus_id: plan-c-eu-us-gac-smoke-v1
vocabulary: ../../docs/corpus-vocabulary.md
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
topology_id: eu_us_gac
topology_scope: eu_us_gac
description: >
  Small Plan C smoke corpus for validating canonical paired templates after the
  US region and fdw_us are available. This is not the final regime corpus; it
  checks that EU-only, ETL and EU+US multiregion strategies render and can be
  routed through the same corpus execution backend.
execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 20
execution_policy:
  cache_policy: mixed_cache_first_observed
  warmup_per_instance: false
  explicit_cache_reset: false
  repetitions_default: 1
  cache_features_in_default_model: false
  order_policy: deterministic_shuffle
  shuffle_seed: 20260625
  record_run_order: true
  record_buffer_features: true

dataset_profiles:
  smoke-v1:
    profile: ../../datasets/profiles/smoke.yml
    load_method: sql

cells:
  - corpus_cell_id: tenant_point_single_smoke_default
    logical_question_id: tenant_point_rollup
    execution_strategy: single_region_citus
    template_id: q04_tenant_point_rollup
    dataset_profile_id: smoke-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: baseline
    expected_regime_targets:
      - well_reduced_localized

  - corpus_cell_id: tenant_point_fdw_smoke_default
    logical_question_id: tenant_point_rollup
    execution_strategy: fdw_raw
    template_id: gac_fdw_tenant_point_rollup
