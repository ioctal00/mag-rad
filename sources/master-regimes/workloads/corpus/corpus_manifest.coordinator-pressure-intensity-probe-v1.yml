corpus_id: coordinator-pressure-intensity-probe-v1
description: >
  Bounded probe for GAC coordinator fan-in and blocking-operator pressure.
  Structural pairs preserve result semantics while moving grouping, Top-K,
  DISTINCT, or JOIN work between regional databases and GAC. The memory pair
  keeps SQL fixed and changes only GAC work_mem.
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
parameter_defaults:
  as_of_unix: [1782864000]

dataset_profiles:
  raw-small-balanced-v1:
    profile: ../../datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe

execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30

execution_policy:
  cache_policy: mixed_cache_coordinator_pressure_probe
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260730
  repetitions_default: 1
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  os_sampler: true
  os_sampler_node_groups:
    - db_nodes
    - analytics_clients
  result_signature: true

cells:
  - corpus_cell_id: coordinator_group_merge_mitigated
    logical_question_id: user_value_topk
    execution_strategy: multiregion_union
    template_id: gac_fdw_coordinator_partial_user_topk
    dataset_profile_id: raw-small-balanced-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: gac_finalization
    pressure_axis: gac_finalization
    pressure_level: mitigated
    pressure_pair_key: coordinator_probe__group_merge
    physical_strategy_id: regional_partial_aggregate
    coordinator_pressure_kind: [fanin, group_merge, sort_topk]
    coordinator_shape_id: group_merge
    mitigation_action: push_partial_grouping_to_regions
    target_metric: paired_coordinator_severity_vector
    dataset_role: coordinator_pressure_probe
    parameters:
      cutoff_ts: ["2026-06-01 00:00:00+00"]
      tenant_modulus: [1]
      limit_k: [5000]

