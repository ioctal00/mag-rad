    parameters:
      # For pilot-skew-heavy-v1, tenant IDs 1/5/10 are hot probes
      # (1% hot tenants over 1..1000), while 100/500/1000 are cold controls.
      tenant_id: [1, 5, 10, 100, 500, 1000]
