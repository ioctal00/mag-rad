corpus_id: clean-run-eu-us-gac-v1
vocabulary: ../../docs/corpus-vocabulary.md
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
topology_id: eu_us_gac
topology_scope: eu_us_gac
description: >
  Clean-run corpus for the manual pre-feature-extraction execution dataset.
  This manifest is intentionally larger than Plan C pilot, but still bounded:
  it expands controlled template parameters across two pilot dataset profiles
  and applies runtime interventions only where template sensitivity metadata
  says the intervention is meaningful.
execution_budget:
  hard_timeout_seconds: 900
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_first_observed
  warmup_per_instance: false
  explicit_cache_reset: false
  repetitions_default: 1
  cache_features_in_default_model: false
  order_policy: deterministic_shuffle
  shuffle_seed: 20260626
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  gac_etl_bootstrap_lookback_days: 1
  gac_etl_bootstrap_timeout_seconds: 600

dataset_profiles:
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  pilot-skew-heavy-v1:
    profile: ../../datasets/profiles/pilot-skew-heavy.yml
    load_method: copy_pipe

cells:
  # Single-region Citus controls. These run on regional coordinators and give a
  # direct Citus baseline for the same logical questions used by GAC/FDW.
  - corpus_cell_id: single_daily_rollup_default
    logical_question_id: daily_tenant_rollup
    execution_strategy: single_region_citus
    template_id: q01_tenant_rollup
    dataset_profile_id: [pilot-balanced-v1, pilot-skew-heavy-v1]
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: baseline
    expected_regime_targets: [well_reduced_localized]
    parameters:
      lookback_days: [1, 3, 7, 14, 30]
      min_value: [0, 100, 500, 900]

  - corpus_cell_id: single_event_filter_default
