corpus_id: pressure-raw-v1-gac
corpus_version: pressure-raw-corpus-v1
batch_id: batch-100-gac
collection_contract_version: pressure-raw-v1
description: >
  GAC/coordinator pressure collection with 75 positive counterfactual pairs
  across five physical mechanisms and 24 negative-control pairs. Strategy
  evidence and observed severity remain separate.
query_groups: ../query-groups.yml
runtime_catalog: ../runtime-configs.yml
parameter_defaults:
  as_of_unix: [1782864000]

dataset_profiles:
  raw-small-balanced-v1:
    profile: ../../../datasets/profiles/raw-small-balanced.yml
    load_method: copy_pipe
  pilot-balanced-v1:
    profile: ../../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  raw-large-balanced-v1:
    profile: ../../../datasets/profiles/raw-large-balanced.yml
    load_method: copy_pipe

execution_budget: {hard_timeout_seconds: 1800, timeout_grace_seconds: 30}
execution_policy:
  cache_policy: mixed_cache_first_observed
  order_policy: deterministic_interleaved_shuffle
  shuffle_seed: 20260730
  repetitions_default: 3
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  os_sampler: true
  os_sampler_node_groups: [db_nodes, analytics_clients]
  result_signature: true
  result_signature_scope: first_repetition_per_condition
  network_profile_probe: false

cells:
  # 15 raw-fan-in versus regional-partial aggregation pairs.
  - corpus_cell_id: gac_group_merge_mitigated
    logical_question_id: user_value_topk
    execution_strategy: multiregion_union
    template_id: gac_fdw_coordinator_partial_user_topk
    dataset_profile_id: [raw-small-balanced-v1, pilot-balanced-v1, raw-large-balanced-v1]
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: gac_finalization
    pressure_axis: gac_finalization
    pressure_level: mitigated
    pressure_pair_key: gac__group_merge_fanin
    physical_strategy_id: regional_partial_aggregate
    scenario_level: parameterized
    coordinator_pressure_kind: [fanin, group_merge, sort_topk]
    coordinator_shape_id: user_group_topk
    mitigation_action: regional_partial_aggregation
    target_metric: paired_coordinator_severity_vector
    dataset_role: pressure_isolated
    parameters:
      cutoff_ts: ["2026-06-01 00:00:00+00"]
      tenant_modulus: [16, 8, 4, 2, 1]
      limit_k: [100]

  - corpus_cell_id: gac_group_merge_stressed
    logical_question_id: user_value_topk
    execution_strategy: multiregion_union
    template_id: gac_fdw_coordinator_raw_user_topk
    dataset_profile_id: [raw-small-balanced-v1, pilot-balanced-v1, raw-large-balanced-v1]
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: gac_finalization
    pressure_axis: gac_finalization
    pressure_level: stressed
    pressure_pair_key: gac__group_merge_fanin
    physical_strategy_id: gac_raw_aggregate
    scenario_level: parameterized
    coordinator_pressure_kind: [fanin, group_merge, sort_topk]
    coordinator_shape_id: user_group_topk
    mitigation_action: regional_partial_aggregation
    target_metric: paired_coordinator_severity_vector
    dataset_role: pressure_isolated
    parameters:
      cutoff_ts: ["2026-06-01 00:00:00+00"]
      tenant_modulus: [16, 8, 4, 2, 1]
      limit_k: [100]

  # 15 global Top-K versus per-region candidate Top-K pairs.
  - corpus_cell_id: gac_topk_candidates_mitigated
    logical_question_id: event_raw_wide_sample
    execution_strategy: multiregion_union
    template_id: gac_fdw_coordinator_regional_event_topk
    dataset_profile_id: [raw-small-balanced-v1, pilot-balanced-v1, raw-large-balanced-v1]
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: gac_finalization
    pressure_axis: gac_finalization
    pressure_level: mitigated
    pressure_pair_key: gac__global_topk
    physical_strategy_id: regional_topk_candidates
    scenario_level: parameterized
    coordinator_pressure_kind: [fanin, sort_topk]
    coordinator_shape_id: event_topk
    mitigation_action: regional_topk_candidates
    target_metric: paired_coordinator_severity_vector
    dataset_role: pressure_isolated
    parameters:
      cutoff_ts: ["2026-06-01 00:00:00+00"]
      limit_k: [10, 100, 500, 2000, 5000]

  - corpus_cell_id: gac_topk_raw_stressed
