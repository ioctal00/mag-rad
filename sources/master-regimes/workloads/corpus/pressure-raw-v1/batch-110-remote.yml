    dataset_profile_id: [raw-small-balanced-v1, pilot-balanced-v1, raw-large-balanced-v1]
    runtime_config_id: pressure_remote_mitigated
    topology_id: eu_us_gac
    intervention_role: positive_case
    intervention_axis: remote_path
    pressure_axis: remote_path
    pressure_level: mitigated
    pressure_pair_key: remote_main__raw_region_rollup
    mitigation_action: mitigate_remote_path_bundle
    target_metric: execution_time_seconds
    dataset_role: pressure_isolated
    parameters: {lookback_days: [7, 30]}
