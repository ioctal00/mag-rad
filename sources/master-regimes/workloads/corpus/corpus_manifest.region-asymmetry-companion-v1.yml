corpus_id: clean-run-eu-us-gac-region-asymmetry-v1
vocabulary: ../../docs/corpus-vocabulary.md
query_groups: query-groups.yml
runtime_catalog: runtime-configs.yml
topology_id: eu_us_gac
topology_scope: eu_us_gac
description: >
  Targeted external-validation companion for region-volume imbalance and
  region-local skew asymmetry. This corpus intentionally keeps runtime fixed to
  default and uses approximately 150 query executions so that remote_region_*,
  worker_task_* and pushdown-fidelity evidence can be checked without repeating
  the full clean-run-v1 baseline.
execution_budget:
  hard_timeout_seconds: 300
  timeout_grace_seconds: 30
execution_policy:
  cache_policy: mixed_cache_first_observed
  warmup_per_instance: false
  explicit_cache_reset: false
  repetitions_default: 1
  cache_features_in_default_model: false
  order_policy: deterministic_shuffle
  shuffle_seed: 20260702
  record_run_order: true
  record_buffer_features: true
  fdw_auto_explain: true
  gac_etl_bootstrap_lookback_days: 1
  gac_etl_bootstrap_timeout_seconds: 300

dataset_profiles:
  pilot-balanced-v1:
    profile: ../../datasets/profiles/pilot-balanced.yml
    load_method: copy_pipe
  pilot-region-imbalanced-v1:
    profile: ../../datasets/profiles/pilot-region-imbalanced.yml
    load_method: copy_pipe
  pilot-region-local-skew-asymmetric-medium-v1:
    profile: ../../datasets/profiles/pilot-region-local-skew-asymmetric-medium.yml
    load_method: copy_pipe

cells:
  - corpus_cell_id: asymmetry_mr_top_tenants
    logical_question_id: top_tenants
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_top_tenants
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
    runtime_config_id: default
    topology_id: eu_us_gac
    intervention_role: calibration
    intervention_axis: dataset_region_asymmetry
    expected_regime_targets: [remote_fetch_heavy, gac_finalization_heavy, skew_imbalance]
    parameters:
      lookback_days: [1, 7, 30]
      limit_k: [25, 50]

  - corpus_cell_id: asymmetry_mr_daily_tenant_rollup
    logical_question_id: daily_tenant_rollup
    execution_strategy: multiregion_union
    template_id: gac_fdw_multiregion_daily_tenant_rollup
    dataset_profile_id:
      - pilot-balanced-v1
      - pilot-region-imbalanced-v1
      - pilot-region-local-skew-asymmetric-medium-v1
