    intervention_axis: dataset_region_asymmetry
    expected_regime_targets: [gac_finalization_heavy, skew_imbalance]
    parameters:
      lookback_days: [1, 7, 14, 30]
      min_value: [0, 500]
      limit_k: [50]

  - corpus_cell_id: asymmetry_mr_event_filter_summary
