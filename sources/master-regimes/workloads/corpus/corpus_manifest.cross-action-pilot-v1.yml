  - <<: *single_edge
    corpus_cell_id: pilot_join_regional_memory
    component_match_id: pilot_repartition_join
    logical_question_id: user_segment_topk
    template_id: gac_fdw_single_edge_repartition_user_join_pair
    runtime_config_id: cross_action_join_regional_memory_mitigated
    pressure_level: mitigated
    variant: mitigated
    pressure_pair_key: pilot_repartition_join__regional_memory
    physical_strategy_id: repartition_mapmerge_join
    mitigation_action: increase_regional_work_mem
    parameters: *join_parameters

  # Two GAC Top-K scenarios with rewrite, memory and transport actions.
  - <<: *multi_edge
    corpus_cell_id: pilot_topk_baseline
    component_match_id: pilot_gac_topk
    logical_question_id: event_raw_wide_sample
    template_id: gac_fdw_coordinator_raw_event_topk
    runtime_config_id: cross_action_stressed
    pressure_level: stressed
    variant: stressed
    pressure_pair_key: pilot_gac_topk__baseline
