catalog_id: query-groups-v1
vocabulary: ../../docs/corpus-vocabulary.md
purpose: >
  Canonical logical-question groups for regime-corpus design. This file maps
  analytic intent to execution strategies and statuses before generating
  corpus cells or expanding SQL instance counts.

status_values:
  runnable_now: Strategy has a template and can run on the current EU+US+GAC setup.
  template_ready_needs_us: Legacy status for templates that existed before US/fdw_us was active.
  needs_template: SQL template or suite entry does not exist yet.
  needs_etl_view: ETL/materialized object is missing or not wired for this question.
  needs_strategy_design: Strategy concept is valid but needs a clearer execution design.
  future_optional: Useful later, not required for the first regime corpus.

strategy_values:
  - single_region_citus
  - fdw_raw
  - etl_materialized
  - regional_partial
  - multiregion_union

groups:
  - logical_question_id: stats_ceb_count
    description: >
      External STATS-CEB scalar-count queries selected before execution by
      expected Citus physical strategy.
    primary_regime_targets:
      - remote_fetch_heavy
      - join_movement
      - well_reduced_localized
    strategies:
      single_region_citus:
        status: future_optional
        notes: >
          Canonical correctness is handled by the isolated GAC baseline schema,
          not by a corpus-facing single-region template.
      fdw_raw:
        status: future_optional
        notes: >
          The pilot intentionally requires both independent regional branches
          in one global observation.
      etl_materialized:
        status: future_optional
        notes: STATS-CEB has no ETL-equivalent question in this bounded pilot.
      regional_partial:
        status: future_optional
        notes: Scalar COUNT pushdown already represents the regional reduction.
      multiregion_union:
        status: runnable_now
        template_id: stats_ceb_multiregion_count
        suite: workloads/suites/stats-ceb-portability.yml

  - logical_question_id: daily_tenant_rollup
    description: Daily tenant-level aggregate over events.
    primary_regime_targets:
      - gac_finalization_heavy
      - well_reduced_localized
    strategies:
      single_region_citus:
        status: runnable_now
        template_id: q01_tenant_rollup
        suite: workloads/suites/single-region-core.yml
      fdw_raw:
        status: runnable_now
        template_id: gac_fdw_daily_rollup
        suite: workloads/suites/gac-current-runnable.yml
      etl_materialized:
        status: runnable_now
        template_id: gac_etl_local_rollup
        suite: workloads/suites/gac-current-runnable.yml
        materialized_object: etl.daily_tenant_rollup
      regional_partial:
        status: needs_strategy_design
        notes: >
          Candidate for explicit regional partial aggregate followed by GAC
          finalization. Current FDW remote probe can approximate the regional
          plan, but there is no separate regional-partial template yet.
      multiregion_union:
        status: runnable_now
        template_id: gac_fdw_multiregion_daily_tenant_rollup
        suite: workloads/suites/gac-fdw-multiregion-analytics-client.yml

  - logical_question_id: top_tenants
    description: Top tenants by event value or event activity in a time window.
    primary_regime_targets:
      - remote_fetch_heavy
      - gac_finalization_heavy
    strategies:
      single_region_citus:
