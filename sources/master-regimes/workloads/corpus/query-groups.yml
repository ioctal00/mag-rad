        template_id: gac_etl_top_tenants
        suite: workloads/suites/gac-current-runnable.yml
        materialized_object: etl.daily_tenant_rollup
      regional_partial:
        status: needs_template
        notes: >
          Add explicit regional top-k/partial aggregate before final GAC top-k.
      multiregion_union:
        status: runnable_now
        template_id: gac_fdw_multiregion_top_tenants
        alternate_template_ids:
          - gac_fdw_multiregion_top_tenants_raw_finalize
          - gac_fdw_multiregion_hot_worker_probe
        suite: workloads/suites/gac-fdw-multiregion-analytics-client.yml

