suite_id: gac-parser-smoke
scope: gac_fdw_etl_parser_validation
description: Minimal representative GAC workload for validating query-sweep indexing and plan parsing.
target_group: analytics_clients
required_topology_capabilities:
  - fdw_eu
  - etl_daily_tenant_rollup

templates:
  gac_fdw_daily_rollup:
    file: templates/gac-fdw/gac_fdw_daily_rollup.sql.j2
    family: fdw_aggregation
    logical_question_id: daily_tenant_rollup
    execution_strategy: fdw_raw
    expected_regime_targets:
      - gac_finalization_heavy
    runtime_sensitivity:
      fetch_size: high
      work_mem: low
      wan_latency: high
    description: FDW aggregate with one remote SQL plan probe.
    expected_pressure_tags:
      - fdw_remote_scan
      - remote_aggregate_candidate
      - coordinator_fanin
    parameters:
      lookback_days: [1]
      min_value: [0]

  gac_fdw_user_segment_join:
    file: templates/gac-fdw/gac_fdw_user_segment_join.sql.j2
    family: fdw_colocated_join
    logical_question_id: user_segment_topk
    execution_strategy: fdw_raw
    expected_regime_targets:
      - gac_finalization_heavy
    runtime_sensitivity:
      fetch_size: high
      work_mem: high
      wan_latency: high
    description: FDW join shape with multiple remote SQL plan probes.
    expected_pressure_tags:
      - fdw_remote_join
      - colocated_join
      - high_group_cardinality
    parameters:
      lookback_days: [7]
      limit_k: [10]

  gac_etl_top_tenants:
    file: templates/gac-etl/gac_etl_top_tenants.sql.j2
    family: local_etl_topk
    logical_question_id: top_tenants
    execution_strategy: etl_materialized
    expected_regime_targets:
      - well_reduced_localized
    runtime_sensitivity:
      fetch_size: none
      work_mem: low
      wan_latency: none
    description: Local ETL read with no FDW remote plan probes.
    expected_pressure_tags:
      - local_etl_read
      - topk
      - low_remote_pressure
    parameters:
      lookback_days: [7]
      limit_k: [10]
