suite_id: gac-fdw-etl-core
scope: gac_fdw_etl_single_region
description: Current GAC smoke suite with FDW query shapes plus one local ETL read shape.

templates:
  gac_fdw_daily_rollup:
    file: templates/gac-fdw/gac_fdw_daily_rollup.sql.j2
    family: fdw_aggregation
    logical_question_id: daily_tenant_rollup
    execution_strategy: fdw_raw
    expected_regime_targets:
      - gac_finalization_heavy
    runtime_sensitivity:
      fetch_size: high
      work_mem: low
      wan_latency: high
    description: Daily aggregation over EU events read through GAC postgres_fdw.
    expected_pressure_tags:
      - fdw_remote_scan
      - remote_aggregate_candidate
      - coordinator_fanin
    parameters:
      lookback_days: [7]
      min_value: [0]

  gac_fdw_tenant_tier_join:
    file: templates/gac-fdw/gac_fdw_tenant_tier_join.sql.j2
    family: fdw_dimension_join
    logical_question_id: tenant_tier_daily_join
    execution_strategy: fdw_raw
    expected_regime_targets:
      - gac_finalization_heavy
    runtime_sensitivity:
      fetch_size: high
      work_mem: high
      wan_latency: high
    description: FDW event-to-tenant join grouped by tenant tier and day.
    expected_pressure_tags:
      - fdw_remote_join
      - dimension_join
      - group_by
    parameters:
      lookback_days: [7]

  gac_fdw_global_user_join:
    file: templates/gac-fdw/gac_fdw_global_user_join.sql.j2
    family: fdw_fact_dimension_join
    logical_question_id: global_user_topk
    execution_strategy: fdw_raw
    expected_regime_targets:
      - join_movement
      - gac_finalization_heavy
    runtime_sensitivity:
      fetch_size: high
      work_mem: high
      wan_latency: high
    description: FDW event-to-global-user join grouped by user attributes.
    expected_pressure_tags:
      - fdw_remote_join
      - high_cardinality_join
      - user_dimension
    parameters:
      lookback_days: [7]
      limit_k: [25]

  gac_fdw_top_tenants:
    file: templates/gac-fdw/gac_fdw_top_tenants.sql.j2
    family: fdw_topk
    logical_question_id: top_tenants
    execution_strategy: fdw_raw
    expected_regime_targets:
      - remote_fetch_heavy
      - gac_finalization_heavy
      - skew_imbalance
    runtime_sensitivity:
      fetch_size: high
      work_mem: high
      wan_latency: high
    description: Top tenants by remote event value through FDW.
    expected_pressure_tags:
      - fdw_remote_scan
      - topk
      - final_ordering
    parameters:
      lookback_days: [7]
      limit_k: [20]

  gac_etl_local_rollup:
    file: templates/gac-etl/gac_etl_local_rollup.sql.j2
    family: local_etl_aggregate
    logical_question_id: daily_tenant_rollup
    execution_strategy: etl_materialized
    expected_regime_targets:
      - well_reduced_localized
    runtime_sensitivity:
      fetch_size: none
      work_mem: low
      wan_latency: none
    description: Local GAC query over materialized ETL rollup sourced from FDW.
    expected_pressure_tags:
      - local_etl_read
      - low_remote_pressure
      - aggregate
    parameters:
      lookback_days: [7]
