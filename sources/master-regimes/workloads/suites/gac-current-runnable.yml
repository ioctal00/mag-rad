suite_id: gac-current-runnable
scope: gac_fdw_etl_single_region
description: All workload instances currently runnable on the GAC analytics node with fdw_eu and etl.daily_tenant_rollup.
target_group: analytics_clients
required_topology_capabilities:
  - fdw_eu
  - etl_daily_tenant_rollup
  - etl_daily_tenant_tier_rollup
  - etl_user_segment_topk_rollup
  - etl_global_user_topk_rollup
  - etl_multi_dimension_rollup

templates:
