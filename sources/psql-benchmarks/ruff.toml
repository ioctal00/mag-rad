line-length = 100
exclude = []

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[lint.isort]
force-sort-within-sections = true  # Forces sorting within sections
force-single-line = false           # (Optional) Change to true for each import on a new line
